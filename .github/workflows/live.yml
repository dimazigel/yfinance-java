name: Live API check

# Yahoo Finance has no public API contract, so the real risk to this library is the endpoints
# drifting underneath it. The unit tests replay fixed JSON and cannot notice that; this suite hits
# the live endpoints on a schedule (and on demand) so drift shows up as a failed run rather than as
# a user's bug report.
#
# Note: GitHub disables scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (off the hour to avoid the top-of-hour rush)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run live integration tests against Yahoo Finance
        run: ./gradlew integrationTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore
