name: Live API check

# Yahoo Finance has no public API contract, so the real risk to this library is the endpoints
# drifting underneath it. The unit tests replay fixed JSON and cannot notice that; this suite hits
# the live endpoints on a schedule (and on demand) so drift shows up as a failed run rather than as
# a user's bug report. A failure of the test step itself opens or updates a `yahoo-drift`-labelled
# issue so it isn't only visible in the Actions tab; an infra hiccup earlier in the job does not.
#
# Note: GitHub disables scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (off the hour to avoid the top-of-hour rush)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run live integration tests against Yahoo Finance
        id: live
        run: ./gradlew integrationTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-test-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore

      - name: Open or update the drift tracking issue
        if: failure() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          gh label create yahoo-drift --description "Live Yahoo API check failed" --color D93F0B --force

          issue=$(gh issue list --label yahoo-drift --state open --limit 1 --json number --jq '.[0].number // empty')

          body=$(cat <<BODY
          The live integration suite failed, which usually means a Yahoo Finance endpoint or response shape changed underneath this library.

          - Run: $RUN_URL
          - Commit: $COMMIT_SHA
          - Trigger: $TRIGGER

          Download the \`live-test-report\` artifact for the failing tests.
          BODY
          )

          if [ -z "$issue" ]; then
            gh issue create --title "Live API check failed: possible Yahoo drift" --label yahoo-drift --body "$body"
          else
            gh issue comment "$issue" --body "$body"
          fi
