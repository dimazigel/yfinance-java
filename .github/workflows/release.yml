name: Release

# Manually launched: builds and tests, publishes the Maven package to GitHub Packages, then tags the
# commit and creates the GitHub release. Publishing happens before tagging so a failed publish leaves
# no tag behind and the run can simply be retried.
#
# The release is created with GITHUB_TOKEN, and events raised by GITHUB_TOKEN don't trigger other
# workflows, so publish.yml (which handles releases made through the UI) won't publish a second time;
# publish.yml also skips releases authored by github-actions[bot] explicitly. Both workflows check
# the registry before publishing, so a version can never be uploaded twice.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump from the latest tag (ignored if version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version, e.g. 0.1.0 (leave empty to bump the latest tag)"
        type: string
        required: false
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases can only be made from main (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              *)     version="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error::'$version' is not a valid release version (expected MAJOR.MINOR.PATCH[-qualifier], no SNAPSHOT)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists."
            exit 1
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # If a previous run published this version but failed before tagging, re-running must not
      # try to publish again (the registry rejects duplicates); it just picks up at the tag step.
      - name: Check whether this version is already published
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-published.sh "$VERSION"

      - name: Publish to GitHub Packages
        if: steps.registry.outputs.published == 'false'
        run: ./gradlew verifySourcesPublication publishAllPublicationsToGitHubPackagesRepository -PreleaseVersion="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "${flags[@]}"
