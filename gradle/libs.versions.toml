[versions]
okhttp = "5.5.0"
feign = "13.15"
jackson = "3.2.3"
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.23.0"
jspecify = "1.0.1"
slf4j = "2.0.20"
logback = "1.5.38"
errorprone = "2.50.0"
nullaway = "0.14.2"
errorprone-plugin = "5.1.1"
nullaway-plugin = "3.2.0"
spotless = "8.10.2"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver" }

feign-bom = { module = "io.github.openfeign:feign-bom", version.ref = "feign" }
feign-core = { module = "io.github.openfeign:feign-core" }
feign-okhttp = { module = "io.github.openfeign:feign-okhttp" }
feign-jackson3 = { module = "io.github.openfeign:feign-jackson3" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
nullaway = { id = "net.ltgt.nullaway", version.ref = "nullaway-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
